name: Update Maritime Incidents

on:
  # Scheduled auto-updates DISABLED. This "Update maritime incidents" automation
  # belongs to the old website; the current live site does not consume
  # public/incidents.json (it is not referenced in the production bundle), so the
  # 30-minute commits to main were obsolete. The workflow file and history are
  # preserved, and manual runs remain possible via workflow_dispatch.
  # schedule:
  #   - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-incidents:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Fix Playwright permissions
        run: chmod +x node_modules/.bin/playwright

      - name: Run incident update script
        run: node scripts/update-incidents.js

      - name: Commit updated incidents
        run: |
          git config user.name "trident-live-bot"
          git config user.email "intelligence@tridentrisk.org"
          git add public/incidents.json
          git commit -m "Update maritime incidents" || echo "No changes"
          git push